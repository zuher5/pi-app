name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach the APK to tagged releases

jobs:
  apk:
    # ubuntu-24.04 ships the Android SDK (ANDROID_HOME); newer images may not.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            server/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # The mobile app reuses client-safe modules from server/lib (@pi alias).
      - name: Install server deps
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Install, check, test, build web
        working-directory: mobile
        run: |
          npm ci
          npx svelte-check --tsconfig ./tsconfig.json
          npm test
          npx vite build
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pi-app-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/*.apk
